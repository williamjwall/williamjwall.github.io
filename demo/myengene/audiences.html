<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyEngene for individuals and industries.">
    <title>MyEngene | Who We Serve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="serve-hero">
            <div class="container">
                <p class="section-kicker">Audiences</p>
                <h1>Who We Serve</h1>
                <p class="serve-hero-lead">Patients, communities, and organizations using pharmacogenomics to prescribe safer and more effective treatments.</p>
            </div>
        </section>

        <section class="serve-section">
            <div class="container container-wide">
                <div class="serve-highlights" id="serve-highlights">
                    <button type="button" class="serve-highlight" data-category="For Individuals">
                        <span class="serve-highlight-icon" aria-hidden="true">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <span class="serve-highlight-text">
                            <span class="serve-highlight-label">Individuals</span>
                            <span class="serve-highlight-desc">Patients &amp; communities</span>
                        </span>
                    </button>
                    <button type="button" class="serve-highlight" data-category="For Industries">
                        <span class="serve-highlight-icon" aria-hidden="true">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
                        </span>
                        <span class="serve-highlight-text">
                            <span class="serve-highlight-label">Industries</span>
                            <span class="serve-highlight-desc">Healthcare &amp; enterprise</span>
                        </span>
                    </button>
                    <button type="button" class="serve-highlight" data-category="Guides">
                        <span class="serve-highlight-icon" aria-hidden="true">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        </span>
                        <span class="serve-highlight-text">
                            <span class="serve-highlight-label">General</span>
                            <span class="serve-highlight-desc">PGx overview guides</span>
                        </span>
                    </button>
                </div>

                <header class="serve-explorer-intro">
                    <h2 class="section-title">Explore topics</h2>
                    <p class="section-lead serve-explorer-lead">Search and read audience briefs from the original MyEngene site.</p>
                </header>

                <div class="serve-explorer">
                    <div class="serve-explorer-toolbar">
                        <label class="serve-explorer-search" for="serve-search">
                            <svg class="serve-explorer-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="search" id="serve-search" class="serve-explorer-input" placeholder="Search audiences and topics…" autocomplete="off">
                        </label>
                        <span class="serve-explorer-badge" id="serve-count" aria-live="polite"></span>
                    </div>

                    <div class="serve-explorer-tabs" id="serve-tabs" role="tablist" aria-label="Filter by audience">
                        <button type="button" class="serve-explorer-tab active" data-category="" role="tab" aria-selected="true">All</button>
                        <button type="button" class="serve-explorer-tab" data-category="Guides" role="tab" aria-selected="false">General</button>
                        <button type="button" class="serve-explorer-tab" data-category="For Individuals" role="tab" aria-selected="false">Individuals</button>
                        <button type="button" class="serve-explorer-tab" data-category="For Industries" role="tab" aria-selected="false">Industries</button>
                    </div>

                    <div class="serve-explorer-body">
                        <nav class="serve-explorer-nav" aria-label="Topics">
                            <p class="serve-explorer-nav-label">Topics</p>
                            <ul class="serve-explorer-list" id="serve-list"></ul>
                        </nav>
                        <article class="serve-explorer-panel" id="serve-panel">
                            <p class="serve-explorer-empty">Select a topic to read.</p>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>
    <div id="search-mount"></div>

    <script src="js/layout.js" data-page="audiences"></script>
    <script src="js/effects.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script src="js/search.js"></script>
    <script src="js/main.js"></script>
    <script src="js/audiences.js"></script>
</body>
</html>
